%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: ONERA M6 WING (Dimensional case) - STEADY RUN              %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%


% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%

% Solver to use for compressible flow case: EULER, NAVIER_STOKES, or RANS
% Use NAVIER_STOKES for laminar viscous flow
% Use RANS for turbulent viscous flow (turbulence model must be specified: SA, SST)
%SOLVER= RANS
%KIND_TURB_MODEL= SA
SOLVER= EULER

% Mathematical problem (DIRECT, CONTINUOUS_ADJOINT, LINEARIZED)
MATH_PROBLEM = DIRECT      % Use DIRECT for standard CFD simulation

% Restart setting
RESTART_SOL = NO           % Won't restart from a previous solution




% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%

% Mach number at infinity
MACH_NUMBER = 0.8395

% Flow orientation is defined here when using MARKER_FAR as the boundary condition
AOA = 3.06
SIDESLIP_ANGLE = 0.0

% INIT_OPTION controls how the free-stream conditions (ρ∞, p∞, T∞) are defined
%INIT_OPTION=REYNOLDS  >> Use Reynolds-based initialization (will use Reynolds number given, so pressure and density will be override)
%INIT_OPTION=TD_CONDITIONS  >> Use given thermodynamic conditions instead (will use pressure and temperature given)
INIT_OPTION=TD_CONDITIONS

% ----------------- Setting to use with "INIT_OPTION=TD_CONDITIONS" ---------------
% Free-stream thermodynamic state option
%FREESTREAM_OPTION= TEMPERATURE_FS  >> Compute density from pressure & temperature
%FREESTREAM_OPTION= DENSITY_FS  >> Compute temperature from pressure & density
FREESTREAM_OPTION= TEMPERATURE_FS

% Free-stream conditions (SI units)
FREESTREAM_TEMPERATURE = 255.56                          % K
FREESTREAM_PRESSURE = 315980                             % Pa
%FREESTREAM_DENSITY = 4.308                              % kg/m^3 (Density optional if temperature and pressure are given)

% ----------------- Setting to use with "INIT_OPTION=REYNOLDS" ---------------
% Reynolds number
%REYNOLDS_NUMBER = 11.72e6                                % Set viscosity (defines the flow Reynolds number)
%REYNOLDS_LENGTH = 0.1646                                 % Length used for Reynolds number calculation (reference length)






% -------------------- IDEAL GAS CONSTANTS --------------------%

% Different gas model (STANDARD_AIR, IDEAL_GAS, VW_GAS, PR_GAS)
FLUID_MODEL= STANDARD_AIR    % Specific heat ratio (γ = 1.4) and Gas constant (R ≈ 287.0 J/kg·K) automatically set

% --------------------------- VISCOSITY MODEL DEFINITION ---------------------------------%

% Viscosity model (SUTHERLAND, CONSTANT_VISCOSITY)
% CONSTANT_VISCOSITY  >> Fixed mu, good for nondimensional / Re-controlled cases
% SUTHERLAND          >> Realistic, temperature-dependent, use for compressible flows

%VISCOSITY_MODEL= SUTHERLAND

% --------------------------- THERMAL CONDUCTIVITY MODEL ----------------------%

% Conductivity model (CONSTANT_CONDUCTIVITY, CONSTANT_PRANDTL)
% CONSTANT_CONDUCTIVITY  >> Use fixed thermal conductivity (k), rarely used
% CONSTANT_PRANDTL       >> Conductivity linked to viscosity via Pr number (common for air)

%CONDUCTIVITY_MODEL= CONSTANT_PRANDTL   % Prandtl number (Pr ≈ 0.72) is automatically set for air






% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
REF_ORIGIN_MOMENT_X = 0.00
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH = 0.1646             % Length used to normalize aerodynamic coefficients
REF_AREA = 0                    % Area used to normalize aerodynamic coefficients (0 implies automatic calculation)


% Reference dimensionalization options for compressible flow

% Freestream pressure scaled to 1 (dimensionless)
%REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE
% Freestream velocity scaled to Mach number (dimensionless)                                                                    
%REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_MACH
% Freestream velocity scaled to 1 (dimensionless)                                                                       
%REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE                                                                         

% Physical units (m/s, Pa, K, kg/m^3)
REF_DIMENSIONALIZATION= DIMENSIONAL                                                            




% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%MARKER_HEATFLUX = (geometry, 0.0)                 % Viscous wall (no-slip)
MARKER_EULER = (geometry)     %  No viscous wall (slip)
MARKER_FAR = (farfield)
MARKER_SYM = (symmetry)  % Used it whith 3D domain

% Output / monitoring
MARKER_PLOTTING = (geometry)
MARKER_MONITORING = (geometry)





% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%

% Numerical method for spatial gradients (GREEN_GAUSS, WEIGHTED_LEAST_SQUARES)
% GREEN_GAUSS = Fast, good on structured meshes, less accurate on skewed.
% WEIGHTED_LEAST_SQUARES = More accurate on unstructured/skewed, slightly costlier.
NUM_METHOD_GRAD= GREEN_GAUSS

CFL_NUMBER= 1.0

%  Disable adaptive CFL
%CFL_ADAPT= NO

%  Enable adaptive CFL and set parameters: (factor down, factor up, CFL min, CFL max)
CFL_ADAPT= YES
CFL_ADAPT_PARAM= (0.5, 1.5, 1.0, 100)




% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
% Linear solver for implicit formulations (BCGSTAB, FGMRES)
LINEAR_SOLVER= FGMRES
%
% Preconditioner of the Krylov linear solver (JACOBI, LINELET, LU_SGS)
LINEAR_SOLVER_PREC= ILU
%
% Minimum error of the linear solver for implicit formulations
LINEAR_SOLVER_ERROR= 1E-10
%
% Max number of iterations of the linear solver for the implicit formulation
LINEAR_SOLVER_ITER= 10



% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
% Multi-Grid Levels (0 = no multi-grid)
MGLEVEL= 0
%
% Multi-grid cycle (V_CYCLE, W_CYCLE, FULLMG_CYCLE)
MGCYCLE= W_CYCLE
%
% Multi-grid pre-smoothing level
MG_PRE_SMOOTH= ( 1, 2, 3, 3 )
%
% Multi-grid post-smoothing level
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
%
% Jacobi implicit smoothing of the correction
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
%
% Damping factor for the residual restriction
MG_DAMP_RESTRICTION= 0.9
%
% Damping factor for the correction prolongation
MG_DAMP_PROLONGATION= 0.9



% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%

% These parameters apply to the main flow (Navier–Stokes) equations

% Convective numerical method (JST, LAX-FRIEDRICH, CUSP, ROE, AUSM, HLLC, TURKEL_PREC, MSW)

% FDS = Upwind flux-difference splitting, robust, works for low-speed & compressible flows
% JST = Central + dissipation, good for transonic
% LAX-FRIEDRICH = Very diffusive, mainly for testing
% CUSP = Central-upwind, low dissipation, good shock capture
% ROE = Accurate upwind, may need entropy fix
% AUSM = Good for compressible flows
% HLLC = Robust, sharp shock capture
% TURKEL_PREC = Preconditioned for low-Mach flows
% MSW = Simple flux split, more diffusive

CONV_NUM_METHOD_FLOW = HLLC

% 2nd and 4th order artificial dissipation coefficients
%JST_SENSOR_COEFF= ( 0.5, 0.02 )

% Monotonic Upwind Scheme for Conservation Laws (TVD) in the flow equations. Required for 2nd order upwind schemes (NO, YES)
% MUSCL_FLOW = YES  >>  Enables 2nd-order TVD (Total Variation Diminishing) scheme for more accurate flow predictions in regions with steep gradients (shocks, boundary layers, shear layers), reducing numerical diffusion. PS cannot be used with CONV_NUM_METHOD_FLOW = JST.
% MUSCL_FLOW = NO  >>  Uses 1st-order upwind, more stable but less accurate.
MUSCL_FLOW = YES

% Slope limiter (NONE, VENKATAKRISHNAN, VENKATAKRISHNAN_WANG, BARTH_JESPERSEN, VAN_ALBADA_EDGE)

% NONE = no limiting (1st-order accurate, may oscillate)
% VENKATAKRISHNAN = smooth limiter for gradients
% VENKATAKRISHNAN_WANG = modified version, often better for 2D/3D flows
% BARTH_JESPERSEN = classic limiter for compressible flows
% VAN_ALBADA_EDGE = robust for edge-based schemes

SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG

% Coefficient for the limiter (smooth regions)
VENKAT_LIMITER_COEFF= 0.05








% -------------------- TURBULENT NUMERICAL METHOD DEFINITION -----------------------%

% These parameters apply only to the turbulence equations (e.g., SA, SST)


% Convective numerical method (SCALAR_UPWIND)
CONV_NUM_METHOD_TURB= SCALAR_UPWIND

% Monotonic Upwind Scheme for Conservation Laws (TVD) in the turbulence equations. Improves the accuracy and stability of turbulence model variable transport (SA, SST).
% MUSCL_TURB = YES  >>   Enables 2nd-order TVD for turbulence variables. Improves stability and accuracy in unsteady shock–boundary layer interactions.
% MUSCL_TURB = NO  >>  Uses 1st-order upwind for turbulence variables, more robust but overly diffusive, damping key features.
MUSCL_TURB = NO

% Slope limiter (NONE, VENKATAKRISHNAN, VENKATAKRISHNAN_WANG, MINMOD)
SLOPE_LIMITER_TURB= VENKATAKRISHNAN_WANG                       % We don’t specify the coefficient limiter twice (VENKAT_LIMITER_COEFF = 0.05)





% --------------------------- TIME DISCRETIZATION DEFINITION ---------------------------------%
% STEADY SETTING

% Time discretization (RUNGE-KUTTA_EXPLICIT, EULER_IMPLICIT, EULER_EXPLICIT)
% For steady-state simulation, Euler implicit is used because it is stable and allows fast convergence with large pseudo-time steps (has to be used for steady-state simulation)
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT

TIME_DOMAIN = NO                              % Define the steady-state simulation

% Runge-Kutta alpha coefficients for steady-state pseudo-time integration (3-stage scheme)
RK_ALPHA_COEFF= (0.6667, 0.6667, 1.0000)

% Number of total iterations to run
ITER= 2500


% TRANSIENT SETTING

% Time discretization (RUNGE-KUTTA_EXPLICIT, EULER_IMPLICIT, EULER_EXPLICIT)
% For time-dependent simulation, Euler explicit (or Runge-Kutta explicit) is used to advance physical time accurately. Hence small steps are needed for stability (has to be used for transient simulation)
%TIME_DISCRE_FLOW= EULER_EXPLICIT
%TIME_DISCRE_TURB= EULER_EXPLICIT


%TIME_DOMAIN = YES                             % Define the time-dependent simulation

% Time marching (DUAL_TIME_STEPPING-1ST_ORDER, DUAL_TIME_STEPPING-2ND_ORDER, HARMONIC_BALANCE, NO, ROTATIONAL_FRAME, TIME_STEPPING)

% DUAL_TIME_STEPPING-1ST_ORDER = implicit time marching, first-order accuracy
% DUAL_TIME_STEPPING-2ND_ORDER = implicit time marching, second-order accuracy
% HARMONIC_BALANCE = no time marching, solves periodic flow
% NO = no time marching, solver behave as steady
% ROTATIONAL_FRAME = time marching in a rotating reference frame
% TIME_STEPPING = explicit time marching

%TIME_MARCHING = DUAL_TIME_STEPPING-1ST_ORDER     % Standard workaround that can be used instead of TIME_STEPPING because it ignores the OUTPUT_WRT_FREQ command line

%TIME_STEP = 13.2e-6                   % Dimensional time-step (Δt)
%MAX_TIME = 52.8                       % Total simulation time to cover (T_total)
%TIME_ITER = 4000000                    % Number of total time-step to run (N_total = 400000)


% For implicit time integration >> specify the number of inner iterations per time step (typically 10–50)
%INNER_ITER = 10                       % Max number of sub-iterations per time step for convergence (btw 10 and 50)

% For explicit time integration >> use a single inner iteration or omit this setting, since each time step is advanced directly
%INNER_ITER = 1




% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
% Convergence criteria (CAUCHY, RESIDUAL)
CONV_FIELD= RMS_DENSITY
%
% Min value of the residual (log10 of the residual)
CONV_RESIDUAL_MINVAL= -12
%
% Start convergence criteria at iteration number
CONV_STARTITER= 10
%
% Number of elements to apply the criteria
CONV_CAUCHY_ELEMS= 100
%
% Epsilon to control the series convergence
CONV_CAUCHY_EPS= 1E-6



% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%

% Input files
MESH_FILENAME= test8.su2
MESH_FORMAT= SU2

% Output files
%MESH_OUT_FILENAME= mesh_out.su2                     % Used to output a modified mesh (adaptive mesh refinement)
%SOLUTION_FILENAME= solution_flow.dat                % Used to start a simulation from a previous run
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= flow
%GRAD_OBJFUNC_FILENAME= of_grad.dat                  % Only used for adjoint optimization (not used in DIRECT simulations)
SURFACE_FILENAME= surface_flow

% Writing solution file frequency
OUTPUT_WRT_FREQ = 100                                % Outputs every 1,000 steps
SCREEN_WRT_FREQ_INNER = 1



% STEADY SETTING
SCREEN_OUTPUT = (INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_MOMENTUM-Z, RMS_ENERGY, LIFT, DRAG)
HISTORY_OUTPUT= (INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_MOMENTUM-Z, RMS_ENERGY, LIFT, DRAG)

% TRANSIENT SETTING
%SCREEN_OUTPUT = (TIME_ITER, CUR_TIME, RMS_RES, LIST, LIFT, DRAG)
%HISTORY_OUTPUT= (TIME_ITER, CUR_TIME, RMS_RES, LIST, LIFT, DRAG)
